<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1b1f4b;
    --bg2: #2d1b5a;
    --ink: #22243a;
    --yellow: #fde68a;
    --yellow-edge: #f5c84c;
    --green: #bbf7d0;
    --green-edge: #5fd394;
    --p1: #38bdf8;
    --p2: #fb7185;
    --gold: #fcd34d;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--white);
    background:
      radial-gradient(circle at 15% 20%, rgba(56,189,248,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(251,113,133,.18), transparent 40%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Header / scores ---------- */
  header {
    width: min(1400px, 96vw);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 14px 0 10px;
  }

  h1 {
    font-size: clamp(1.4rem, 3vw, 2.4rem);
    font-weight: 700;
    letter-spacing: .5px;
    text-align: center;
    text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  h1 span { color: var(--gold); }

  .player {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,.08);
    border: 3px solid transparent;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .35s, border-color .35s, box-shadow .35s, opacity .35s;
    opacity: .55;
  }
  .player.p1 { justify-self: start; }
  .player.p2 { justify-self: end; flex-direction: row-reverse; }
  .player.active { opacity: 1; transform: scale(1.08); }
  .player.p1.active { border-color: var(--p1); background: rgba(56,189,248,.18); box-shadow: 0 0 24px rgba(56,189,248,.5); }
  .player.p2.active { border-color: var(--p2); background: rgba(251,113,133,.18); box-shadow: 0 0 24px rgba(251,113,133,.5); }

  .player .name { font-size: clamp(1rem, 2vw, 1.5rem); font-weight: 600; }
  .player .score {
    font-size: clamp(1.6rem, 3.2vw, 2.6rem);
    font-weight: 700;
    min-width: 1.6em;
    text-align: center;
    border-radius: 12px;
    padding: 0 8px;
    color: var(--ink);
  }
  .p1 .score { background: var(--p1); }
  .p2 .score { background: var(--p2); }
  .score.bump { animation: bump .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.6) rotate(-8deg)} 100%{transform:scale(1)} }

  .tools {
    position: fixed;
    bottom: 12px;
    right: 14px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .icon-btn {
    font: inherit;
    font-size: 1.3rem;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,.14);
    color: var(--white);
    transition: background .2s, transform .2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.28); transform: scale(1.08); }

  /* ---------- Board ---------- */
  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 0 16px;
  }

  .board {
    --cols: 6;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: clamp(6px, 1.1vw, 14px);
    width: min(96vw, calc((100dvh - 130px) * 1.95));
    perspective: 1400px;
  }

  @media (orientation: portrait) {
    .board {
      --cols: 4;
      width: min(96vw, calc((100dvh - 150px) * .86));
    }
    header { grid-template-columns: 1fr 1fr; }
    h1 { grid-column: 1 / -1; order: -1; }
  }

  .card {
    aspect-ratio: 4 / 3;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    container-type: inline-size;
    font: inherit;
    position: relative;
    opacity: 0;
    transform: translateY(-60px) scale(.6) rotate(-10deg);
  }
  .card.dealt {
    animation: deal .55s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: var(--delay, 0s);
  }
  @keyframes deal {
    to { opacity: 1; transform: none; }
  }

  .inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.34,1.45,.55,1);
  }
  .card:not(.flipped):not(.matched):hover .inner { transform: translateY(-6px) rotateX(8deg) rotateZ(-1deg); }
  .card.flipped .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 7cqi;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6cqi;
    box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.35);
  }

  /* Dos des cartes */
  .back {
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 0 22%, transparent 23%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 6px, transparent 6px 14px),
      linear-gradient(145deg, #6d5dfc, #8b5cf6 55%, #a855f7);
    border: 1.6cqi solid rgba(255,255,255,.85);
  }
  .back::after {
    content: "?";
    font-size: 30cqi;
    font-weight: 700;
    color: var(--white);
    text-shadow: 0 1.2cqi 0 rgba(0,0,0,.25);
  }

  /* Faces visibles */
  .front {
    transform: rotateY(180deg);
    color: var(--ink);
    line-height: 1.18;
  }
  .front.word {
    background: linear-gradient(160deg, #dcfce7, var(--green));
    border: 1.6cqi solid var(--green-edge);
    font-size: 10.5cqi;
    font-weight: 700;
  }
  .front.def {
    background: linear-gradient(160deg, #fef9c3, var(--yellow));
    border: 1.6cqi solid var(--yellow-edge);
    font-size: 7.8cqi;
    font-weight: 500;
  }
  .front .tag {
    position: absolute;
    top: 3cqi;
    left: 4cqi;
    font-size: 5cqi;
    opacity: .55;
  }

  /* Paire ratée : petit tremblement */
  .card.wrong .inner { animation: shake .45s ease; }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    20% { transform: rotateY(180deg) translateX(-7%) rotateZ(-3deg); }
    40% { transform: rotateY(180deg) translateX(6%) rotateZ(3deg); }
    60% { transform: rotateY(180deg) translateX(-4%); }
    80% { transform: rotateY(180deg) translateX(3%); }
  }
  .card.wrong .front { box-shadow: 0 0 0 1.4cqi #ef4444, 0 10px 22px rgba(0,0,0,.35); }

  /* Paire trouvée : brille puis s'envole */
  .card.matched { pointer-events: none; }
  .card.matched .inner { animation: win-pop 1.1s cubic-bezier(.5,0,.75,0) forwards; }
  .card.matched .front { box-shadow: 0 0 0 1.6cqi var(--gold), 0 0 40px 10px rgba(252,211,77,.8); }
  @keyframes win-pop {
    0%   { transform: rotateY(180deg) scale(1); }
    30%  { transform: rotateY(180deg) scale(1.15) rotateZ(4deg); }
    45%  { transform: rotateY(180deg) scale(1.1) rotateZ(-4deg); }
    100% { transform: rotateY(180deg) scale(0) rotateZ(200deg); opacity: 0; }
  }

  /* +1 qui s'envole */
  .float-point {
    position: fixed;
    font-size: clamp(2rem, 4vw, 3.4rem);
    font-weight: 700;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 3px 0 rgba(0,0,0,.3);
    animation: float-up 1s ease-out forwards;
  }
  @keyframes float-up {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    25% { transform: translate(-50%, -80%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -220%) scale(1); opacity: 0; }
  }

  /* Bandeau "Au tour de..." */
  .turn-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    padding: 18px 46px;
    border-radius: 999px;
    font-size: clamp(1.6rem, 4vw, 3rem);
    font-weight: 700;
    color: var(--ink);
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.3);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .turn-banner.show { animation: banner 1.1s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes banner {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
  }

  /* ---------- Écrans (accueil / fin) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    text-align: center;
    padding: 20px;
    background: rgba(15, 12, 40, .82);
    backdrop-filter: blur(6px);
    transition: opacity .4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h2 {
    font-size: clamp(2.2rem, 7vw, 5rem);
    line-height: 1.05;
  }
  .overlay p { font-size: clamp(1rem, 2.2vw, 1.5rem); opacity: .9; max-width: 760px; }

  .big-btn {
    font: inherit;
    font-size: clamp(1.3rem, 3vw, 2rem);
    font-weight: 700;
    padding: .55em 1.8em;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: var(--ink);
    background: var(--gold);
    box-shadow: 0 6px 0 #b98b09, 0 14px 30px rgba(0,0,0,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .big-btn:hover { transform: translateY(-3px) scale(1.04); }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b98b09; }

  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(.95rem, 1.8vw, 1.2rem);
    cursor: pointer;
    opacity: .9;
  }
  .option input { width: 22px; height: 22px; accent-color: var(--gold); cursor: pointer; }

  .demo-cards { display: flex; gap: 18px; margin: 1vh 0; }
  .demo-cards div {
    width: 110px; aspect-ratio: 4/3;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-weight: 600; padding: 6px; font-size: .85rem;
  }
  .demo-cards .w { background: var(--green); border: 3px solid var(--green-edge); transform: rotate(-6deg); font-size: 1.1rem; }
  .demo-cards .d { background: var(--yellow); border: 3px solid var(--yellow-edge); transform: rotate(5deg); }

  /* Écran de victoire */
  #end h2 { display: flex; flex-direction: column; align-items: center; gap: 1vh; }
  #end .crown { font-size: clamp(4rem, 12vw, 9rem); animation: crown 1.4s ease-in-out infinite; }
  @keyframes crown { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-14px) rotate(6deg)} }
  #winnerName {
    font-size: clamp(3.5rem, 13vw, 10rem);
    font-weight: 700;
    line-height: 1;
    text-shadow: 0 8px 0 rgba(0,0,0,.3);
    animation: winner-in .9s cubic-bezier(.34,1.56,.64,1) both;
  }
  #winnerName.p1 { color: var(--p1); }
  #winnerName.p2 { color: var(--p2); }
  #winnerName.tie { color: var(--gold); }
  #winnerSub { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 600; }
  @keyframes winner-in {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  #finalScore { font-size: clamp(1.2rem, 3vw, 2rem); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition-duration: .2s; }
  }
</style>
</head>
<body>

<header>
  <div class="player p1 active" id="player0">
    <span class="name">Joueur 1</span>
    <span class="score" id="score0">0</span>
  </div>
  <h1>Memory <span>IA</span></h1>
  <div class="player p2" id="player1">
    <span class="name">Joueur 2</span>
    <span class="score" id="score1">0</span>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<div class="tools">
  <button class="icon-btn" id="muteBtn" title="Son on/off">🔊</button>
  <button class="icon-btn" id="restartBtn" title="Recommencer">↻</button>
</div>

<div class="turn-banner" id="turnBanner"></div>

<!-- Écran d'accueil -->
<div class="overlay" id="start">
  <h2>Memory <span style="color:var(--gold)">IA</span></h2>
  <p>Retournez deux cartes : un <b style="color:var(--green)">mot</b> et sa <b style="color:var(--yellow)">définition</b>.
     Si elles vont ensemble, vous marquez 1 point et les cartes disparaissent !</p>
  <div class="demo-cards">
    <div class="w">robot</div>
    <div class="d">A machine that can do tasks, sometimes like a human.</div>
  </div>
  <label class="option">
    <input type="checkbox" id="replayOption">
    Le joueur qui trouve une paire rejoue
  </label>
  <button class="big-btn" id="playBtn">Jouer !</button>
</div>

<!-- Écran de fin -->
<div class="overlay hidden" id="end">
  <h2>
    <span class="crown">🏆</span>
    <span id="winnerName">Joueur 1</span>
    <span id="winnerSub">a gagné !</span>
  </h2>
  <p id="finalScore"></p>
  <button class="big-btn" id="againBtn">Rejouer</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* =========================================================
   Données : 12 paires mot / définition
   ========================================================= */
const PAIRS = [
  ["artificial intelligence (AI)", "Computer technology that can do things humans usually do with their brain."],
  ["robot",              "A machine that can do tasks, sometimes like a human."],
  ["algorithm",          "A list of instructions that a computer follows."],
  ["data",               "Information (texts, photos, numbers) stored on a computer."],
  ["chatbot",            "A program you can talk to by writing."],
  ["voice assistant",    "A device that answers when you speak (Siri, Alexa)."],
  ["machine learning",   "When a computer learns from many examples."],
  ["facial recognition", "Technology that identifies a person from their face."],
  ["deepfake",           "A fake photo or video made with AI."],
  ["privacy",            "Your personal information that other people shouldn't see."],
  ["prompt",             "The question or instruction you write to an AI."],
  ["to cheat",           "To break the rules in a test or homework."]
];

/* =========================================================
   Sons (générés avec Web Audio : aucun fichier à télécharger)
   ========================================================= */
const Sound = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, start, dur, type = "sine", vol = .25, slideTo = null) {
    const c = this.ctx, t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(start, dur, fromHz, toHz, vol = .35) {
    const c = this.ctx, t = c.currentTime + start;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(fromHz, t);
    f.frequency.exponentialRampToValueAtTime(toHz, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * .3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t); src.stop(t + dur);
  },
  play(name) {
    if (this.muted || !this.ctx) return;
    switch (name) {
      case "flip":      // "whoosh" + petit clic
        this.noise(0, .16, 600, 3500, .3);
        this.tone(1400, .05, .05, "triangle", .12);
        break;
      case "match":     // arpège joyeux + scintillement
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .08, .25, "triangle", .22));
        [2093, 2637, 3136].forEach((f, i) => this.tone(f, .35 + i * .05, .15, "sine", .07));
        break;
      case "miss":      // "bwoo-bwoo" descendant
        this.tone(330, 0, .18, "square", .07, 260);
        this.tone(250, .18, .3, "square", .07, 180);
        break;
      case "turn":
        this.tone(660, 0, .1, "sine", .12);
        this.tone(880, .08, .14, "sine", .12);
        break;
      case "deal":
        this.noise(0, .07, 2000, 4000, .12);
        break;
      case "win": {     // fanfare
        const n = [[523,0,.15],[523,.15,.15],[523,.3,.15],[659,.45,.45],[587,.9,.15],[659,1.05,.15],[784,1.2,.8]];
        n.forEach(([f, s, d]) => { this.tone(f, s, d, "square", .08); this.tone(f * 2, s, d, "triangle", .1); });
        [1047, 1319, 1568].forEach(f => this.tone(f, 1.2, 1, "sine", .08));
        break;
      }
    }
  }
};

/* =========================================================
   Jeu
   ========================================================= */
const board = document.getElementById("board");
const state = {
  scores: [0, 0],
  current: 0,
  first: null,
  second: null,
  lock: true,
  found: 0,
  replayOnMatch: false
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildBoard() {
  board.innerHTML = "";
  const cards = [];
  PAIRS.forEach(([word, def], id) => {
    cards.push({ id, text: word, kind: "word" });
    cards.push({ id, text: def, kind: "def" });
  });
  shuffle(cards).forEach((c, i) => {
    const el = document.createElement("button");
    el.className = "card";
    el.dataset.pair = c.id;
    el.setAttribute("aria-label", "Carte cachée");
    el.innerHTML = `
      <div class="inner">
        <div class="face back"></div>
        <div class="face front ${c.kind}">${c.text}</div>
      </div>`;
    el.addEventListener("click", () => onCardClick(el));
    board.appendChild(el);
    // distribution animée
    setTimeout(() => {
      el.style.setProperty("--delay", "0s");
      el.classList.add("dealt");
      if (i % 3 === 0) Sound.play("deal");
    }, 120 + i * 55);
  });
  setTimeout(() => { state.lock = false; }, 120 + cards.length * 55 + 400);
}

function updateScores() {
  [0, 1].forEach(p => {
    document.getElementById("score" + p).textContent = state.scores[p];
    document.getElementById("player" + p).classList.toggle("active", state.current === p);
  });
}

function bumpScore(p) {
  const s = document.getElementById("score" + p);
  s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
}

function floatPoint(cardEl, p) {
  const r = cardEl.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "float-point";
  el.textContent = "+1";
  el.style.color = p === 0 ? "var(--p1)" : "var(--p2)";
  el.style.left = (r.left + r.width / 2) + "px";
  el.style.top = (r.top + r.height / 2) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showTurnBanner() {
  const b = document.getElementById("turnBanner");
  b.textContent = `Au tour du Joueur ${state.current + 1}`;
  b.style.background = state.current === 0 ? "var(--p1)" : "var(--p2)";
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  Sound.play("turn");
}

function onCardClick(card) {
  if (state.lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

  card.classList.add("flipped");
  card.setAttribute("aria-label", card.querySelector(".front").textContent);
  Sound.play("flip");

  if (!state.first) { state.first = card; return; }

  state.second = card;
  state.lock = true;

  const isMatch = state.first.dataset.pair === state.second.dataset.pair;
  setTimeout(() => isMatch ? handleMatch() : handleMiss(), 750);
}

function handleMatch() {
  const { first, second, current } = state;
  Sound.play("match");
  first.classList.add("matched");
  second.classList.add("matched");
  state.scores[current]++;
  state.found++;
  floatPoint(second, current);
  updateScores();
  bumpScore(current);

  setTimeout(() => {
    first.style.visibility = second.style.visibility = "hidden";
    resetPick();
    if (state.found === PAIRS.length) return endGame();
    if (!state.replayOnMatch) nextPlayer();
    state.lock = false;
  }, 1150);
}

function handleMiss() {
  const { first, second } = state;
  Sound.play("miss");
  first.classList.add("wrong");
  second.classList.add("wrong");

  setTimeout(() => {
    [first, second].forEach(c => {
      c.classList.remove("wrong", "flipped");
      c.setAttribute("aria-label", "Carte cachée");
    });
    Sound.play("flip");
    resetPick();
    setTimeout(() => { nextPlayer(); state.lock = false; }, 450);
  }, 1300);
}

function resetPick() { state.first = state.second = null; }

function nextPlayer() {
  state.current = 1 - state.current;
  updateScores();
  showTurnBanner();
}

function endGame() {
  const [a, b] = state.scores;
  const name = document.getElementById("winnerName");
  const sub = document.getElementById("winnerSub");
  name.className = "";
  if (a === b) {
    name.textContent = "Égalité !";
    name.classList.add("tie");
    sub.textContent = "Bravo aux deux joueurs !";
  } else {
    const w = a > b ? 0 : 1;
    name.textContent = `Joueur ${w + 1}`;
    name.classList.add(w === 0 ? "p1" : "p2");
    sub.textContent = "a gagné !";
  }
  document.getElementById("finalScore").textContent = `Joueur 1 : ${a} point${a > 1 ? "s" : ""} — Joueur 2 : ${b} point${b > 1 ? "s" : ""}`;
  setTimeout(() => {
    document.getElementById("end").classList.remove("hidden");
    Sound.play("win");
    launchConfetti();
  }, 400);
}

function newGame() {
  stopConfetti();
  Object.assign(state, { scores: [0, 0], current: 0, first: null, second: null, lock: true, found: 0 });
  state.replayOnMatch = document.getElementById("replayOption").checked;
  updateScores();
  document.getElementById("end").classList.add("hidden");
  buildBoard();
}

/* =========================================================
   Confettis
   ========================================================= */
const canvas = document.getElementById("confetti");
const ctx2d = canvas.getContext("2d");
let confettiAnim = null;

function launchConfetti() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ["#38bdf8", "#fb7185", "#fcd34d", "#bbf7d0", "#a78bfa", "#ffffff"];
  const parts = Array.from({ length: 220 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height,
    w: 6 + Math.random() * 8, h: 10 + Math.random() * 10,
    vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4,
    r: Math.random() * Math.PI, vr: -.2 + Math.random() * .4,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  (function frame(now) {
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    const keepGoing = now - start < 6000;
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > canvas.height + 20 && keepGoing) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx2d.save();
      ctx2d.translate(p.x, p.y); ctx2d.rotate(p.r);
      ctx2d.fillStyle = p.c;
      ctx2d.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx2d.restore();
    });
    if (keepGoing || parts.some(p => p.y < canvas.height + 20)) confettiAnim = requestAnimationFrame(frame);
  })(start);
}
function stopConfetti() {
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

/* =========================================================
   Boutons
   ========================================================= */
document.getElementById("playBtn").addEventListener("click", () => {
  Sound.init();
  document.getElementById("start").classList.add("hidden");
  newGame();
});
document.getElementById("againBtn").addEventListener("click", () => { Sound.init(); newGame(); });
document.getElementById("restartBtn").addEventListener("click", () => {
  Sound.init();
  if (confirm("Recommencer une nouvelle partie ?")) newGame();
});
const muteBtn = document.getElementById("muteBtn");
try { Sound.muted = localStorage.getItem("memoryia-muted") === "1"; } catch (e) {}
muteBtn.textContent = Sound.muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => {
  Sound.muted = !Sound.muted;
  muteBtn.textContent = Sound.muted ? "🔇" : "🔊";
  try { localStorage.setItem("memoryia-muted", Sound.muted ? "1" : "0"); } catch (e) {}
});
</script>
